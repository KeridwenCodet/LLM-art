const SR = SPEC.sr, DUR = SPEC.dur, N = Math.round(SR * DUR);
const F0 = SPEC.F0, DT = 1 / SR;
const TC = SPEC.T_CLOUD, TK = SPEC.T_COLL, TH = SPEC.T_HOLD,
      TD = SPEC.T_CHORD, TE = SPEC.T_END;
const V = SPEC.voices;
const SUMW = V.reduce((a, v) => a + v.w, 0);

/* ---------------------------------------------------------------- maths */
const smooth = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
const easeOut = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return 1 - Math.pow(1 - x, 2.4); };
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

function cents(v, t) {
  const base = v.cents0;
  const drift = v.vib_amt * Math.sin(2 * Math.PI * v.vib_rate * t + v.vib_ph);
  if (t < TC) return base + drift;
  if (t < TK) { const u = smooth((t - TC) / (TK - TC)); return (base + drift) * (1 - u); }
  if (t < TH) return 0.16 * drift;
  if (t < TD) { const u = smooth((t - TH) / (TD - TH)); return v.target * u + 0.16 * drift * (1 - u); }
  return v.target + 0.7 * drift;
}

function panOf(v, t) {
  if (t < TC) return v.pan0;
  if (t < TK) { const u = smooth((t - TC) / (TK - TC)); return v.pan0 * Math.pow(1 - u, 1.6); }
  if (t < TH) return 0;
  if (t < TD) { const u = smooth((t - TH) / (TD - TH)); return v.pan_t * u; }
  return v.pan_t;
}

function ampOf(v, t) {
  let a = v.w / SUMW;
  a *= smooth(t / v.attack);
  a *= 0.86 + 0.14 * Math.sin(2 * Math.PI * v.br_rate * t + v.br_ph);
  if (t >= TC && t < TK) a *= 1 - 0.25 * smooth((t - TC) / (TK - TC));
  if (t >= TH && t < TD) a *= 1 + 0.18 * smooth((t - TH) / (TD - TH));
  const tail = (t - TD) / 6.2;
  if (tail > 0) a *= Math.max(0, 1 - easeOut(tail * v.tail));
  return a;
}

/* ------------------------------------------------------------- synthèse */
function synth() {
  const L = new Float32Array(N), R = new Float32Array(N);
  const BLK = 48, inc0 = 2 * Math.PI * F0 * DT;

  for (let vi = 0; vi < V.length; vi++) {
    const v = V[vi];
    let ph = v.phase, phc = 0;
    for (let i0 = 0; i0 < N; i0 += BLK) {
      const t = i0 * DT;
      const f = F0 * Math.pow(2, cents(v, t) / 1200);
      const a = ampOf(v, t);
      const p = panOf(v, t);
      const ang = (p + 1) * 0.25 * Math.PI;
      const gl = Math.cos(ang) * a, gr = Math.sin(ang) * a;
      const inc = 2 * Math.PI * f * DT;
      let K = 0;
      if (t >= TC && t < TK) K = 1.7e-4 * Math.pow(clamp01((t - TC) / (TK - TC)), 2.2);
      else if (t >= TK && t < TH) K = 4.5e-5;
      else if (t >= TH && t < TH + 1.5) K = 4.5e-5 * (1 - (t - TH) / 1.5);
      const n = Math.min(BLK, N - i0);
      for (let k = 0; k < n; k++) {
        ph += inc; phc += inc0;
        if (K !== 0) ph += K * Math.sin(phc - ph);
        const s = Math.sin(ph), j = i0 + k;
        L[j] += s * gl; R[j] += s * gr;
      }
    }
  }

  // souffle du hors-champ (deterministe)
  let seed = 1234567;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 * 2 - 1; };
  let lpL = 0, lpR = 0; const alp = 0.045;
  for (let i = 0; i < N; i++) {
    const t = i * DT;
    let g;
    if (t < TC) g = 0.012 + 0.010 * smooth(t / TC);
    else if (t < TK) g = 0.022 * Math.pow(1 - smooth((t - TC) / (TK - TC)), 1.5);
    else if (t < TH) g = 0.0025;
    else g = 0.0025 + 0.011 * smooth((t - TH) / (TE - TH));
    lpL += alp * (rnd() - lpL); lpR += alp * (rnd() - lpR);
    L[i] += lpL * g; R[i] += lpR * g;
  }

  // reverb de Schroeder
  function rev(x) {
    const mix = 0.42;
    const combs = [[779, .80], [809, .78], [746, .77], [711, .75]];
    const aps = [[225, .5], [278, .5]];
    const out = new Float32Array(x.length);
    for (const [d, fb] of combs) {
      const buf = new Float32Array(d); let idx = 0, damp = 0;
      for (let i = 0; i < x.length; i++) {
        const y = buf[idx];
        damp = y * 0.72 + damp * 0.28;
        buf[idx] = x[i] + damp * fb;
        idx = (idx + 1) % d;
        out[i] += y * 0.25;
      }
    }
    for (const [d, g] of aps) {
      const buf = new Float32Array(d); let idx = 0;
      for (let i = 0; i < out.length; i++) {
        const bo = buf[idx];
        const y = -g * out[i] + bo;
        buf[idx] = out[i] + g * y;
        idx = (idx + 1) % d;
        out[i] = y;
      }
    }
    for (let i = 0; i < x.length; i++) x[i] = x[i] * (1 - mix) + out[i] * mix;
    return x;
  }
  rev(L); rev(R);

  // mastering
  let peak = 1e-9;
  for (let i = 0; i < N; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > peak) peak = a; if (b > peak) peak = b; }
  const tanh = z => { const e = Math.exp(2 * z); return (e - 1) / (e + 1); };
  const drive = 1.05, norm = tanh(drive * 1.35);
  for (let i = 0; i < N; i++) {
    const t = i * DT;
    let f = 1;
    if (t < 1.2) f *= smooth(t / 1.2);
    if (t > TE - 1.8) f *= smooth((TE - t) / 1.8);
    L[i] = tanh(L[i] / peak * drive * 1.35) / norm * f;
    R[i] = tanh(R[i] / peak * drive * 1.35) / norm * f;
  }
  return [L, R];
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
let ghost, past, bg, grainPat;
let pts = [];          // positions ecran des voix, [voix][pas]
const STEPS = 720;

function warp(c) {
  // log adouci : continu au voisinage de l'unisson, etale jusqu'a l'octave.
  // une simple puissance laissait un trou au centre (pente infinie en 0).
  const s = c < 0 ? -1 : 1;
  const k = 45, span = Math.log(1 + 1250 / k);
  return s * Math.min(1, Math.log(1 + Math.abs(c) / k) / span);
}

let geo = {};
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const m = Math.max(38, W * 0.055);
  geo = {
    l: m, r: W - m,
    top: H * 0.155, bot: H * 0.845,
    mid: (H * 0.155 + H * 0.845) / 2,
    half: (H * 0.845 - H * 0.155) / 2,
  };
  geo.x = t => geo.l + (t / DUR) * (geo.r - geo.l);
  geo.y = c => geo.mid - warp(c) * geo.half * 0.92;

  // positions precalculees
  pts = V.map(v => {
    const arr = new Float32Array(STEPS + 1);
    for (let k = 0; k <= STEPS; k++) arr[k] = geo.y(cents(v, k / STEPS * DUR));
    return arr;
  });

  bg = makeBG();
  ghost = makeGhost();
  past = document.createElement('canvas');
  past.width = cv.width; past.height = cv.height;
  past.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
}

function makeGrain() {
  const g = document.createElement('canvas');
  g.width = g.height = 128;
  const gc = g.getContext('2d');
  const im = gc.createImageData(128, 128);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    im.data[i + 3] = 14;
  }
  gc.putImageData(im, 0, 0);
  return g;
}

function makeBG() {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H);

  const rg = g.createRadialGradient(W * 0.5, geo.mid, 0, W * 0.5, geo.mid, Math.max(W, H) * 0.75);
  rg.addColorStop(0, 'rgba(26,34,50,0.55)');
  rg.addColorStop(0.45, 'rgba(12,16,26,0.35)');
  rg.addColorStop(1, 'rgba(3,4,7,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);


  // titre
  g.fillStyle = 'rgba(222,230,242,0.92)';
  g.font = '300 ' + Math.max(16, Math.min(34, W * 0.023)) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  g.letterSpacing = '0.17em';
  g.fillText("L'INSTANT D'AVANT LE MOT", geo.l - 12, geo.top - 54);

  g.letterSpacing = '0.20em';
  g.font = '300 ' + Math.max(11, Math.min(16, W * 0.0115)) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  g.fillStyle = 'rgba(190,206,226,0.85)';
  const sub = "unisson en mi · 64 voix · 36 secondes";
  g.fillText(sub.toUpperCase(), geo.l - 12, geo.top - 32);

  // frise des mouvements
  g.letterSpacing = '0.20em';
  const fsFrise = Math.max(11, Math.min(15, W * 0.0062));
  g.font = '300 ' + fsFrise + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  const segs = [[0, TC, 'nuée'], [TC, TK, 'effondrement'], [TK, TH, 'tenue'], [TH, TD, 'accord'], [TD, TE, 'extinction']];
  g.letterSpacing = '0.26em';
  for (const [a, b, lab] of segs) {
    g.fillStyle = 'rgba(196,212,232,0.72)';
    g.fillText(lab.toUpperCase(), geo.x(a) + 14, geo.bot + 52);
  }

  // grain
  const pat = g.createPattern(makeGrain(), 'repeat');
  g.fillStyle = pat; g.fillRect(0, 0, W, H);
  return c;
}

function voiceColor(k, t) {
  // froid avant l'effondrement, chaud apres
  const u = smooth((t - TK) / (TD - TK));   // le chaud nait de l'effondrement, pas de l'accord
  const cold = [[96, 148, 202], [148, 188, 220], [120, 176, 182]];
  const warm = [[244, 176, 84], [252, 220, 156], [224, 138, 82]];
  const c = cold[k % 3], w = warm[k % 3];
  return [c[0] + (w[0] - c[0]) * u, c[1] + (w[1] - c[1]) * u, c[2] + (w[2] - c[2]) * u];
}

function makeGhost() {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.lineCap = 'round';
  for (let k = 0; k < V.length; k++) {
    const v = V[k];
    const col = voiceColor(k, DUR);
    g.strokeStyle = 'rgba(' + col.map(Math.round).join(',') + ',' + (0.075 + 0.11 * v.w) + ')';
    g.lineWidth = 0.6 + 0.9 * v.w;
    g.beginPath();
    for (let s = 0; s <= STEPS; s++) {
      const x = geo.x(s / STEPS * DUR), y = pts[k][s];
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  return c;
}

/* -------------------------------------------------------------- lecture */
let actx = null, buf = null, src = null, t0 = 0, playing = false, ready = false, busy = false;
let lastStep = -1;
// ?t=21 fige la piece a un instant donne (controle visuel, partage d'une image)
const QS = new URLSearchParams(location.search);
const FROZEN = QS.has('t') ? Math.max(0, Math.min(DUR, parseFloat(QS.get('t')) || 0)) : null;

function reveal(t) {
  const g = past.getContext('2d');
  g.lineCap = 'round';
  const step = Math.floor(t / DUR * STEPS);
  if (step <= lastStep) return;
  const from = Math.max(0, lastStep);
  for (let k = 0; k < V.length; k++) {
    const v = V[k];
    g.lineWidth = 1 + 1.0 * v.w;
    const alpha = 0.58 + 0.40 * v.w;
    for (let s = Math.max(1, from); s <= step; s++) {
      // chaque segment porte la couleur de son epoque : froid avant, chaud apres
      const col = voiceColor(k, s / STEPS * DUR);
      g.strokeStyle = 'rgba(' + col.map(x => Math.round(x)).join(',') + ',' + alpha + ')';
      g.beginPath();
      g.moveTo(geo.x((s - 1) / STEPS * DUR), pts[k][s - 1]);
      g.lineTo(geo.x(s / STEPS * DUR), pts[k][s]);
      g.stroke();
    }
  }
  lastStep = step;
}

function headY(k, t) {
  const pos = t / DUR * STEPS;
  const i = Math.min(STEPS - 1, Math.floor(pos)), f = pos - i;
  return pts[k][i] * (1 - f) + pts[k][i + 1] * f;
}

function draw() {
  requestAnimationFrame(draw);
  const now = FROZEN !== null ? FROZEN : (playing && actx ? Math.min(DUR, actx.currentTime - t0) : 0);
  if (FROZEN !== null) reveal(now); else if (playing) reveal(now);

  ctx.drawImage(bg, 0, 0, W, H);
  ctx.globalAlpha = 0.55; ctx.drawImage(ghost, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.drawImage(past, 0, 0, W, H);

  // tete de lecture
  const x = geo.x(now);
  const grd = ctx.createLinearGradient(x, geo.top - 30, x, geo.bot + 30);
  grd.addColorStop(0, 'rgba(220,230,245,0)');
  grd.addColorStop(0.5, 'rgba(235,242,252,' + (playing ? 0.55 : 0.18) + ')');
  grd.addColorStop(1, 'rgba(220,230,245,0)');
  ctx.strokeStyle = grd; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, geo.top - 30); ctx.lineTo(x, geo.bot + 30); ctx.stroke();

  // points lumineux sur chaque voix
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < V.length; k++) {
    const v = V[k];
    const y = headY(k, now);
    const col = voiceColor(k, now);
    const a = 0.35 + 0.65 * v.w;
    ctx.fillStyle = 'rgba(' + col.map(Math.round).join(',') + ',' + (0.10 * a) + ')';
    ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,240,' + (0.75 * a) + ')';
    ctx.beginPath(); ctx.arc(x, y, 1.15 + 0.8 * v.w, 0, 7); ctx.fill();
  }

  // halo de l'effondrement
  const d = Math.abs(now - TK);
  if (now > TC) {
    const pulse = Math.max(0, 1 - d / 3.2);
    const hx = geo.x(TK), hy = geo.mid;
    const R = 40 + 190 * (1 - pulse);
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, R);
    const inten = (0.05 + 0.55 * pulse * pulse) * (now < TE - 1 ? 1 : 0.4);
    hg.addColorStop(0, 'rgba(255,246,228,' + inten + ')');
    hg.addColorStop(0.35, 'rgba(230,190,130,' + inten * 0.35 + ')');
    hg.addColorStop(1, 'rgba(180,140,90,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // etat + compteur, haut droite
  ctx.textAlign = 'right';
  ctx.letterSpacing = '0.24em';
  ctx.font = '300 ' + Math.max(13, Math.min(19, W * 0.0078)) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  const icon = busy ? '···' : (playing ? '❚❚' : '▶');
  ctx.fillStyle = 'rgba(226,234,246,0.80)';
  ctx.fillText(icon, geo.r + 12, geo.top - 54);
  if (!playing) {
    ctx.font = '300 ' + Math.max(11, Math.min(15, W * 0.0062)) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillStyle = 'rgba(186,202,222,0.72)';
    ctx.fillText(busy ? 'CALCUL DE LA PIÈCE' : 'CLIQUEZ POUR JOUER', geo.r + 12, geo.top - 34);
  }
  ctx.textAlign = 'left';
}

/* ----------------------------------------------------------------- audio */
async function start() {
  if (busy) return;
  if (playing) {                       // pause = stop, la piece se rejoue depuis le debut
    playing = false;
    if (src) { try { src.stop(); } catch (e) {} src = null; }
    resetCanvas(); return;
  }
  if (!ready) {
    busy = true;
    await new Promise(r => setTimeout(r, 30));
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR }); }
      catch (e) { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    }
    const [L, R] = synth();
    buf = actx.createBuffer(2, N, SR);
    buf.copyToChannel(L, 0); buf.copyToChannel(R, 1);
    ready = true; busy = false;
  }
  if (actx.state === 'suspended') await actx.resume();
  resetCanvas();
  src = actx.createBufferSource();
  src.buffer = buf; src.connect(actx.destination);
  src.start();
  t0 = actx.currentTime;
  playing = true;
  src.onended = () => { playing = false; };
}

function resetCanvas() {
  const g = past.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, past.width, past.height);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  lastStep = -1;
}

cv.addEventListener('click', start);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); start(); }
});
window.addEventListener('resize', () => { layout(); resetCanvas(); });

layout();
if (FROZEN !== null) reveal(FROZEN);
draw();
</script>
</body>
