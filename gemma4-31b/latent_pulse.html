<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--card);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--muted-foreground);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="overlay">Effleure-moi...</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles;
        const particleCount = 150;
        const mouse = { x: -1000, y: -1000, active: false };

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.size = Math.random() * 3 + 1;
                this.color = this.getRandomColor();
                this.history = [];
                this.maxHistory = Math.floor(Math.random() * 15 + 5);
            }

            getRandomColor() {
                const colors = [
                    '#9b59b6', // Amethyst
                    '#8e44ad', // Wisteria
                    '#d4af37', // Gold
                    '#6c5ce7', // Soft Purple
                    '#a29bfe'  // Pastel Purple
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) this.history.shift();

                // Perlin-like flow
                const angle = (Math.sin(this.x * 0.01) + Math.cos(this.y * 0.01)) * Math.PI;
                this.vx += Math.cos(angle) * 0.1;
                this.vy += Math.sin(angle) * 0.1;

                // Mouse interaction
                if (mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        const force = (200 - dist) / 2000;
                        this.vx += dx * force;
                        this.vy += dy * force;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size / 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (this.history.length > 1) {
                    ctx.moveTo(this.history[0].x, this.history[0].y);
                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }
                }
                ctx.stroke();
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Subtle fade for trailing effect
            ctx.fillStyle = 'rgba(20, 20, 25, 0.1)'; 
            // We use a semi-transparent fill to create trails. 
            // Since we use CSS variables for background, we approximate here.
            // For a true dynamic background, we'd need to sample the color.
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });
        window.addEventListener('mousedown', () => { mouse.active = true; });
        window.addEventListener('mouseup', () => { mouse.active = false; });

        resize();
        animate();
    </script>
</body>
</html>
