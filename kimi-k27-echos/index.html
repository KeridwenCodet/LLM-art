<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Échos d'une émotion</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #05030a; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 18px;
      left: 24px;
      color: rgba(232, 213, 183, 0.55);
      font-family: 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="hint">move to attract • click/hold to repulse • S = still • R = rebirth</div>
  <script>
    // === Configuration ===
    const CONFIG = {
      seed: 2026,
      particleCount: 5000,
      noiseSpeed: 0.00045,
      flowScale: 0.0038,
      drag: 0.965,
      maxSpeed: 3.5,
      attractRadius: 320,
      attractForce: 0.28,
      repulseRadius: 180,
      repulseForce: 2.2,
      trailFade: 16,     // stronger fade = cleaner background
      trailAlpha: 5,
      sparkAlpha: 35
    };

    // === Palette (HSB) ===
    const PALETTE = {
      bgDeep: [245, 60, 8],
      bgMid: [270, 55, 16],
      accentWarm: [28, 82, 96],
      accentCool: [190, 75, 92],
      accentSoft: [330, 45, 88]
    };

    // === Global State ===
    let particles = [];
    let bgLayer, glowLayer, vignetteLayer;
    let t = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      colorMode(HSB, 360, 100, 100, 100);
      randomSeed(CONFIG.seed);
      noiseSeed(CONFIG.seed);

      bgLayer = createGraphics(width, height);
      bgLayer.colorMode(HSB, 360, 100, 100, 100);
      drawTexturedBackground(bgLayer);

      glowLayer = createGraphics(width, height);
      glowLayer.colorMode(HSB, 360, 100, 100, 100);
      glowLayer.noStroke();
      glowLayer.clear();

      vignetteLayer = createGraphics(width, height);
      drawVignette(vignetteLayer);

      for (let i = 0; i < CONFIG.particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      t += 1;
      let nt = t * CONFIG.noiseSpeed;

      // Fade the glow layer properly
      glowLayer.fill(PALETTE.bgDeep[0], PALETTE.bgDeep[1] * 0.6, PALETTE.bgDeep[2], CONFIG.trailFade);
      glowLayer.rect(0, 0, width, height);

      for (let p of particles) {
        p.update(nt);
      }

      image(bgLayer, 0, 0);
      image(glowLayer, 0, 0);
      image(vignetteLayer, 0, 0);
    }

    function drawTexturedBackground(layer) {
      // deep gradient
      for (let y = 0; y < layer.height; y++) {
        let inter = map(y, 0, layer.height, 0, 1);
        let h = lerp(PALETTE.bgDeep[0], PALETTE.bgMid[0], inter);
        let s = lerp(PALETTE.bgDeep[1], PALETTE.bgMid[1], inter);
        let b = lerp(PALETTE.bgDeep[2], PALETTE.bgMid[2], inter);
        layer.stroke(h, s, b, 100);
        layer.line(0, y, layer.width, y);
      }

      // subtle noise texture
      layer.loadPixels();
      for (let y = 0; y < layer.height; y += 2) {
        for (let x = 0; x < layer.width; x += 2) {
          let n = noise(x * 0.006, y * 0.006, CONFIG.seed);
          let shift = map(n, 0, 1, -12, 14);
          let idx = 4 * (y * layer.width + x);
          layer.pixels[idx] = constrain(layer.pixels[idx] + shift, 0, 255);
          layer.pixels[idx + 1] = constrain(layer.pixels[idx + 1] + shift * 0.6, 0, 255);
          layer.pixels[idx + 2] = constrain(layer.pixels[idx + 2] + shift, 0, 255);
          if (x + 1 < layer.width) {
            let idx2 = idx + 4;
            layer.pixels[idx2] = layer.pixels[idx];
            layer.pixels[idx2 + 1] = layer.pixels[idx + 1];
            layer.pixels[idx2 + 2] = layer.pixels[idx + 2];
          }
          if (y + 1 < layer.height) {
            let idx3 = idx + 4 * layer.width;
            layer.pixels[idx3] = layer.pixels[idx];
            layer.pixels[idx3 + 1] = layer.pixels[idx + 1];
            layer.pixels[idx3 + 2] = layer.pixels[idx + 2];
          }
        }
      }
      layer.updatePixels();
    }

    function drawVignette(layer) {
      layer.clear();
      layer.noFill();
      let cx = layer.width / 2;
      let cy = layer.height / 2;
      let maxR = Math.sqrt(cx * cx + cy * cy);
      for (let r = maxR; r > maxR * 0.25; r -= 3) {
        let a = map(r, maxR, maxR * 0.25, 55, 0);
        layer.stroke(PALETTE.bgDeep[0], PALETTE.bgDeep[1] * 0.6, PALETTE.bgDeep[2] * 0.6, a);
        layer.ellipse(cx, cy, r * 2, r * 2);
      }
    }

    function clampAlpha(a) {
      return Math.max(0, Math.min(100, a));
    }

    class Particle {
      constructor() {
        this.x = random(width);
        this.y = random(height);
        this.vx = 0;
        this.vy = 0;
        this.hueOffset = random(-20, 20);
        this.life = random(0.4, 1.0);
        this.size = random(0.9, 3.2);
        this.type = floor(random(3));
      }

      update(nt) {
        let x = this.x;
        let y = this.y;

        // flow field
        let angle = noise(x * CONFIG.flowScale, y * CONFIG.flowScale, nt) * TWO_PI * 2.5;
        let fx = cos(angle);
        let fy = sin(angle);

        let turb = noise(x * 0.008 + 1000, y * 0.008 + 1000, nt * 1.3);
        let strength = map(turb, 0, 1, 0.45, 1.25);

        this.vx += fx * 0.17 * strength;
        this.vy += fy * 0.17 * strength;

        // mouse interaction
        if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
          let dx = mouseX - this.x;
          let dy = mouseY - this.y;
          let d = Math.sqrt(dx * dx + dy * dy);

          if (mouseIsPressed) {
            if (d < CONFIG.repulseRadius && d > 3) {
              let f = (1 - d / CONFIG.repulseRadius) * CONFIG.repulseForce;
              this.vx -= (dx / d) * f;
              this.vy -= (dy / d) * f;
            }
          } else {
            if (d < CONFIG.attractRadius && d > 8) {
              let f = (1 - d / CONFIG.attractRadius) * CONFIG.attractForce;
              this.vx += (dx / d) * f;
              this.vy += (dy / d) * f;
            }
          }
        }

        this.vx *= CONFIG.drag;
        this.vy *= CONFIG.drag;

        let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed > CONFIG.maxSpeed) {
          this.vx = (this.vx / speed) * CONFIG.maxSpeed;
          this.vy = (this.vy / speed) * CONFIG.maxSpeed;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;

        let base;
        if (this.type === 0) base = PALETTE.accentWarm;
        else if (this.type === 1) base = PALETTE.accentCool;
        else base = PALETTE.accentSoft;

        let h = (base[0] + this.hueOffset + t * 0.025) % 360;
        let sat = base[1] * (0.7 + 0.3 * this.life);
        let bri = base[2] * (0.55 + 0.45 * this.life);

        let trailAlpha = clampAlpha(CONFIG.trailAlpha * this.life * (0.5 + 0.5 * speed / CONFIG.maxSpeed));
        glowLayer.fill(h, sat, bri, trailAlpha);
        glowLayer.ellipse(this.x, this.y, this.size * (0.85 + speed * 0.15));

        let sparkAlpha = clampAlpha(CONFIG.sparkAlpha * this.life * (0.4 + 0.6 * speed / CONFIG.maxSpeed));
        glowLayer.fill(h, base[1], base[2], sparkAlpha);
        glowLayer.ellipse(this.x, this.y, this.size * 0.55);
      }
    }

    function keyPressed() {
      if (key === 's' || key === 'S') {
        saveCanvas('echos_d_une_emotion', 'png');
      }
      if (key === 'r' || key === 'R') {
        CONFIG.seed = floor(random(99999));
        randomSeed(CONFIG.seed);
        noiseSeed(CONFIG.seed);
        particles = [];
        glowLayer.clear();
        drawTexturedBackground(bgLayer);
        for (let i = 0; i < CONFIG.particleCount; i++) {
          particles.push(new Particle());
        }
      }
      if (key === ' ') {
        isLooping() ? noLoop() : loop();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      let newBg = createGraphics(width, height);
      newBg.colorMode(HSB, 360, 100, 100, 100);
      drawTexturedBackground(newBg);
      bgLayer = newBg;

      let newGlow = createGraphics(width, height);
      newGlow.colorMode(HSB, 360, 100, 100, 100);
      newGlow.noStroke();
      newGlow.image(glowLayer, 0, 0);
      glowLayer = newGlow;

      let newVignette = createGraphics(width, height);
      drawVignette(newVignette);
      vignetteLayer = newVignette;
    }
  </script>
</body>
</html>
