<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encre vivante</title>
<style>
  html, body { margin: 0; padding: 0; }
  #stage { position: relative; width: 100%; height: 560px; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; pointer-events: none; }
  #title-box { top: 14px; left: 16px; color: #f5f2ea; padding: 8px 14px; border-radius: 10px;
    background: rgba(6,6,11,.34); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.55); }
  #title-box h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: lowercase; }
  #title-box p { margin: 4px 0 0; font-size: 12px; opacity: .82; letter-spacing: .02em; }
  #moods { bottom: 16px; left: 20px; display: flex; gap: 8px; pointer-events: auto; }
  #moods button {
    font: inherit; font-size: 12px; letter-spacing: .06em;
    color: #f5f2ea; background: rgba(8,8,14,.42);
    border: 1px solid rgba(255,255,255,.20); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
  }
  #moods button:hover { transform: translateY(-1px); background: rgba(20,20,30,.55); }
  #moods button.active { border-color: rgba(255,255,255,.75); background: rgba(255,255,255,.14); }
  #fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:#f5f2ea; font-size:14px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="overlay" id="title-box">
    <h1>encre vivante</h1>
    <p>une encre qui ressent — glisse, clique, elle te répond</p>
  </div>
  <div class="overlay" id="moods">
    <button data-mood="0" class="active">braise</button>
    <button data-mood="1">abîme</button>
    <button data-mood="2">nébuleuse</button>
    <button data-mood="3">samhain 👻</button>
  </div>
  <div id="fallback"><span>WebGL2 n'est pas disponible ici.</span></div>
</div>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('fallback').style.display = 'flex'; window.__err = 'no-webgl2'; return; }

  var VERT = '#version 300 es\n' +
    'layout(location=0) in vec2 a;\n' +
    'void main(){ gl_Position = vec4(a, 0.0, 1.0); }';

  var FRAG = `#version 300 es
precision highp float;

uniform vec2  u_res;        // canvas px
uniform float u_time;       // seconds
uniform vec2  u_mouse;      // px
uniform vec2  u_smear;      // pointer velocity (aspect-normalized space)
uniform vec4  u_ripples[8]; // xy px, z birth time, w strength
uniform vec3  u_coef[8];    // palettes: a1 b1 c1 d1 a2 b2 c2 d2 (cosine palettes)
uniform float u_palMix;     // 0..1 transition between palettes
out vec4 outColor;

mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.,0.)), u.x),
             mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.55;
  for(int i=0;i<5;i++){
    v += a * noise(p);
    p = rot * p * 2.03 + vec2(11.3, -7.7);
    a *= 0.52;
  }
  return v;
}

vec3 pal(float t, int o){
  return u_coef[o] + u_coef[o+1] * cos(6.2831853 * (u_coef[o+2] * t + u_coef[o+3]));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  vec2 p = uv * 1.9;
  float T = u_time * 0.11;               // respiration lente, ambient 0.1x
  float breath = 1.0 + 0.06 * sin(u_time * 0.35);
  p *= breath;

  // --- sillage du pointeur : l'encre se souvient de ton passage ---
  vec2 mpos = (u_mouse - 0.5 * u_res) / u_res.y;
  vec2 dm = uv - mpos;
  float dm2 = dot(dm, dm);
  p += u_smear * 0.38 * exp(-dm2 * 5.0);

  // --- ondulations : clics et gouttes d'encre ---
  for(int i=0;i<8;i++){
    vec4 rp = u_ripples[i];
    if (rp.w == 0.0) continue;
    float age = u_time - rp.z;
    if (age < 0.0 || age > 5.0) continue;
    vec2 rc = (rp.xy - 0.5 * u_res) / u_res.y;
    vec2 d = uv - rc;
    float l = length(d) + 1e-4;
    float radius = 0.10 + age * 0.30;
    float ring = exp(-pow((l - radius) * 6.5, 2.0)) * exp(-age * 0.85) * rp.w;
    vec2 tang = vec2(-d.y, d.x) / l;
    p += tang * ring * 0.34;              // tourbillon
    p += (d / l) * ring * 0.09;           // poussée radiale
  }

  // --- double déformation de domaine : marbrure d'encre ---
  vec2 q = vec2(fbm(p + vec2(0.0, 0.0) + T),
                fbm(p + vec2(5.2, 1.3) - T * 0.8));
  vec2 r = vec2(fbm(p + 3.1*q + vec2(1.7, 9.2) + 0.24*u_time),
                fbm(p + 3.1*q + vec2(8.3, 2.8) - 0.18*u_time));
  float f = fbm(p + 3.3 * r);

  // --- couleur ---
  float hue = f * 1.05 + 0.28 * r.x + 0.03 * sin(u_time * 0.05);
  vec3 c1 = pal(hue, 0);
  vec3 c2 = pal(hue, 4);
  vec3 col = mix(c1, c2, u_palMix);

  float inkline = smoothstep(0.10, 0.62, f);
  vec3 deep = mix(c1, c2, u_palMix) * 0.06 + vec3(0.012, 0.010, 0.018);
  col = mix(deep, col, inkline);                       // profondeur d'encre
  col += 0.30 * pow(clamp(f * 1.15 - 0.18, 0.0, 1.0), 3.6) * vec3(1.0, 0.98, 0.92); // reflets humides
  col *= 0.9 + 0.35 * q.y;                             // filaments lumineux

  // vignette douce
  float vig = 1.0 - 0.42 * dot(uv * vec2(0.82, 1.05), uv * vec2(0.82, 1.05));
  col *= clamp(vig, 0.0, 1.2);

  // grain argentique
  float g = hash(gl_FragCoord.xy + fract(u_time) * 61.7);
  col += (g - 0.5) * 0.035;

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      window.__err = gl.getShaderInfoLog(s);
      throw new Error(window.__err);
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    window.__err = gl.getProgramInfoLog(prog);
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['u_res','u_time','u_mouse','u_smear','u_ripples[0]','u_coef[0]','u_palMix'].forEach(function (n) {
    U[n] = gl.getUniformLocation(prog, n);
  });

  // --- palettes (cosinus, façon IQ) ---
  var PALETTES = [
    { a:[0.46,0.16,0.10], b:[0.52,0.44,0.34], c:[1.0,1.0,1.0], d:[0.00,0.10,0.20] }, // braise
    { a:[0.06,0.21,0.30], b:[0.28,0.46,0.55], c:[1.0,1.0,1.0], d:[0.30,0.18,0.06] }, // abîme
    { a:[0.32,0.12,0.42], b:[0.52,0.36,0.55], c:[1.0,1.0,1.0], d:[0.78,0.48,0.28] }, // nébuleuse
    { a:[0.46,0.16,0.28], b:[0.55,0.44,0.50], c:[1.0,1.0,0.8], d:[0.05,0.28,0.56] }  // samhain
  ];
  var coefData = new Float32Array(24);
  var palFrom = 0, palTo = 0, palMix = 1, palAnim = null;

  function packCoef(i, pal) {
    var o = i * 12;
    [pal.a, pal.b, pal.c, pal.d].forEach(function (v, k) {
      coefData[o + k*3] = v[0]; coefData[o + k*3+1] = v[1]; coefData[o + k*3+2] = v[2];
    });
  }

  function setMood(idx) {
    if (idx === palTo) return;
    // point de départ = état courant interpolé
    palFrom = palTo; // approximation acceptable visuellement
    packCoef(0, currentPalette());
    packCoef(1, PALETTES[idx]);
    palTo = idx; palMix = 0;
    if (palAnim) cancelAnimationFrame(palAnim);
    var t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / 1400);
      palMix = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2; // easeInOutCubic
      if (k < 1) palAnim = requestAnimationFrame(step);
    })(t0);
  }

  function currentPalette() {
    var P = PALETTES[palTo], out = {a:[],b:[],c:[],d:[]};
    ['a','b','c','d'].forEach(function (key) {
      for (var i=0;i<3;i++) out[key][i] = P[key][i];
    });
    return out;
  }

  packCoef(0, PALETTES[0]);
  packCoef(1, PALETTES[0]);
  packCoef(1, PALETTES[1]); // réécrit ci-dessous — garde cohérence
  packCoef(1, PALETTES[0]);

  document.querySelectorAll('#moods button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#moods button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      setMood(parseInt(btn.dataset.mood, 10));
    });
  });

  // --- redimensionnement ---
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    canvas.width = Math.max(2, Math.round(w * dpr));
    canvas.height = Math.max(2, Math.round(h * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // --- pointeur ---
  var mouse = [canvas.width * 0.5, canvas.height * 0.5];
  var lastMouse = null, smear = [0, 0];
  function toGL(e) {
    var r = canvas.getBoundingClientRect();
    return [ (e.clientX - r.left) * dpr, (canvas.height / dpr - (e.clientY - r.top)) * dpr ];
  }
  stage.addEventListener('pointermove', function (e) {
    var m = toGL(e);
    if (lastMouse) {
      var vx = (m[0] - lastMouse[0]) / canvas.height;
      var vy = (m[1] - lastMouse[1]) / canvas.height;
      smear[0] = smear[0]*0.7 + vx*1.4; smear[1] = smear[1]*0.7 + vy*1.4;
    }
    lastMouse = m; mouse = m;
  });
  stage.addEventListener('pointerleave', function () { lastMouse = null; });

  // --- ondulations : buffer circulaire de 8 ---
  var ripples = new Float32Array(32);
  var rIdx = 0;
  function dropRipple(x, y, strength) {
    var o = rIdx * 4;
    ripples[o] = x; ripples[o+1] = y; ripples[o+2] = clock(); ripples[o+3] = strength;
    rIdx = (rIdx + 1) % 8;
  }
  stage.addEventListener('pointerdown', function (e) {
    var m = toGL(e);
    dropRipple(m[0], m[1], 1.15);
  });

  // gouttes spontanées : l'encre respire seule
  function autoDrop() {
    dropRipple(Math.random() * canvas.width, Math.random() * canvas.height, 0.35 + Math.random() * 0.4);
    setTimeout(autoDrop, 5200 + Math.random() * 4200);
  }
  setTimeout(autoDrop, 1800);

  var t0 = performance.now();
  function clock() { return (performance.now() - t0) / 1000; }

  var frames = 0;
  function frame() {
    var t = clock();
    gl.uniform2f(U['u_res'], canvas.width, canvas.height);
    gl.uniform1f(U['u_time'], t);
    gl.uniform2f(U['u_mouse'], mouse[0], mouse[1]);
    gl.uniform2f(U['u_smear'], smear[0], smear[1]);
    smear[0] *= 0.94; smear[1] *= 0.94;
    gl.uniform4fv(U['u_ripples[0]'], ripples);
    gl.uniform3fv(U['u_coef[0]'], coefData);
    gl.uniform1f(U['u_palMix'], palMix);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frames++;
    if (frames === 3) window.__ok = true;   // signal de vérification
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
