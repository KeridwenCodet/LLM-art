<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .wrap { display: inline-block; position: relative; }
  canvas {
    display: block;
    width: min(920px, 100%);
    height: auto;
    border-radius: 18px;
    cursor: crosshair;
  }
  .cap {
    position: absolute; left: 16px; bottom: 12px;
    font-size: 12px; letter-spacing: .14em; font-style: italic;
    opacity: .55; color: var(--foreground, #4a3f5c);
    pointer-events: none; user-select: none;
  }
  .btn {
    position: absolute; right: 12px; bottom: 10px;
    font: inherit; font-size: 11px; letter-spacing: .12em;
    color: var(--foreground, #4a3f5c);
    background: transparent;
    border: 1px solid var(--border, rgba(120,120,120,.4));
    border-radius: 999px; padding: 4px 14px; cursor: pointer;
    opacity: .6; transition: opacity .25s;
  }
  .btn:hover { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="920" height="560"></canvas>
  <div class="cap">flux — caresse la toile, clique pour faire fleurir</div>
  <button class="btn" id="re">↻ nouvelle marée</button>
</div>

<script>
(() => {
  const W = 920, H = 560;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // --- résolution des couleurs du thème ---
  function resolveVar(name, fallback) {
    try {
      const d = document.createElement('div');
      d.style.color = `var(${name}, ${fallback})`;
      document.body.appendChild(d);
      const c = getComputedStyle(d).color;
      d.remove();
      const m = c.match(/rgba?\(([^)]+)\)/);
      if (m) {
        const p = m[1].split(',').map(s => parseFloat(s));
        return [p[0] | 0, p[1] | 0, p[2] | 0];
      }
    } catch (e) {}
    const h = fallback.replace('#', '');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  const mix = (a, b, t) => [0,1,2].map(i => Math.round(a[i]*(1-t) + b[i]*t));
  const lum = c => 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];

  let ACCENT, FORE, BG, isDark, palette, COMPOSITE;

  function buildPalette() {
    ACCENT = resolveVar('--accent', '#8b5cf6');
    FORE   = resolveVar('--foreground', '#4a3f5c');
    BG     = resolveVar('--background', '#ffffff');
    isDark = lum(BG) < 128;
    COMPOSITE = isDark ? 'lighter' : 'source-over';
    if (isDark) {
      palette = [
        ACCENT,
        mix(ACCENT, FORE, 0.35),
        mix(ACCENT, FORE, 0.7),
        FORE,
        mix(ACCENT, [255,255,255], 0.4),
      ];
    } else {
      palette = [
        mix(ACCENT, [30,20,50], 0.28),
        mix(ACCENT, [30,20,50], 0.08),
        mix(ACCENT, FORE, 0.4),
        mix(FORE, ACCENT, 0.25),
        mix(ACCENT, [30,20,50], 0.45),
      ];
    }
  }

  // --- RNG seedé ---
  function mulberry32(s) {
    return () => {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  let rand, field, swirl, particles, bursts, t, seed;

  function makeField() {
    const a = 0.002 + rand()*0.0045;
    const b = 0.002 + rand()*0.0045;
    const c = rand()*Math.PI*2, d = rand()*Math.PI*2;
    const e = 0.0012 + rand()*0.003;
    const k = 1.4 + rand()*1.3;
    return (x, y, tt) => k * (
      Math.sin(x*a + tt*0.42 + c) +
      Math.cos(y*b - tt*0.31 + d) +
      Math.sin((x+y)*e + tt*0.17)
    );
  }

  function spawn(x, y, vx=0, vy=0) {
    return {
      x, y, px: x, py: y, vx, vy,
      life: 90 + rand()*300,
      speed: 0.55 + rand()*1.5,
      col: palette[(rand()*palette.length)|0],
      lw: 0.7 + rand()*1.8,
    };
  }

  function reseed(newSeed) {
    buildPalette();
    seed = newSeed ?? (Math.random()*1e9)|0;
    rand = mulberry32(seed);
    field = makeField();
    swirl = rand() < 0.5 ? 1 : -1;
    t = rand()*100;
    bursts = [];
    particles = [];
    const N = Math.min(900, Math.floor(W*H/900));
    for (let i = 0; i < N; i++) particles.push(spawn(rand()*W, rand()*H));
    ctx.clearRect(0, 0, W, H);
    bloom(W*(0.3+rand()*0.4), H*(0.3+rand()*0.4), 90, true);
  }

  function bloom(x, y, n=70, gentle=false) {
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2 + rand()*0.4;
      const r = gentle ? rand()*140 : 2 + rand()*10;
      const p = spawn(x + Math.cos(a)*r*0.35, y + Math.sin(a)*r*0.35,
                      Math.cos(a)*(gentle?0.5:2.6)*(0.4+rand()),
                      Math.sin(a)*(gentle?0.5:2.6)*(0.4+rand()));
      p.life = 70 + rand()*180;
      particles.push(p);
    }
    bursts.push({x, y, r: 6, a: gentle ? 0.22 : 0.45});
    if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  }

  // --- interactions ---
  let mx = null, my = null, lastTouch = 0;
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
  }
  canvas.addEventListener('pointermove', e => {
    [mx, my] = toCanvas(e); lastTouch = performance.now();
  });
  canvas.addEventListener('pointerleave', () => { mx = my = null; });
  canvas.addEventListener('pointerdown', e => {
    const [x, y] = toCanvas(e);
    bloom(x, y);
    lastTouch = performance.now();
  });
  document.getElementById('re').addEventListener('click', () => reseed());

  // --- boucle ---
  function frame() {
    t += 1/60;

    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = COMPOSITE;
    ctx.lineCap = 'round';

    const a0 = isDark ? 0.16 : 0.20, a1 = isDark ? 0.12 : 0.13, amax = isDark ? 0.62 : 0.72;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const ang = field(p.x, p.y, t);
      p.vx += Math.cos(ang) * 0.11 * p.speed;
      p.vy += Math.sin(ang) * 0.11 * p.speed;

      if (mx !== null) {
        const dx = p.x - mx, dy = p.y - my;
        const d = Math.hypot(dx, dy);
        if (d < 170 && d > 0.5) {
          const f = (1 - d/170) * 1.05;
          p.vx += (-dy/d) * f * swirl + (dx/d) * f * 0.22;
          p.vy += ( dx/d) * f * swirl + (dy/d) * f * 0.22;
        }
      }

      p.vx *= 0.93; p.vy *= 0.93;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 3.2) { p.vx = p.vx/sp*3.2; p.vy = p.vy/sp*3.2; }

      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.life--;

      const alpha = Math.min(amax, a0 + sp*a1);
      ctx.strokeStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${alpha})`;
      ctx.lineWidth = p.lw;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20) {
        particles[i] = spawn(rand()*W, rand()*H);
      }
    }

    // ondes / fleurs de clic
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${b.a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      b.r += 3.2; b.a *= 0.92;
      if (b.a < 0.01) bursts.splice(i, 1);
    }

    // floraison spontanée si la toile se repose
    if (performance.now() - lastTouch > 7000 && rand() < 0.004) {
      bloom(80 + rand()*(W-160), 80 + rand()*(H-160), 60, true);
      lastTouch = performance.now();
    }

    requestAnimationFrame(frame);
  }

  reseed();
  frame();
})();
</script>
</body>
</html>
