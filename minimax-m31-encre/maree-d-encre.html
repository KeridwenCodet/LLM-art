<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marée d'encre — étude générative</title>
<style>
  :root{
    --ink-ground:#07070c;
    --ink-text:#f4ecdd;
    --ink-muted:rgba(244,236,221,.60);
    --ink-seal:#d2452f;
    --hairline:rgba(244,236,221,.13);
    --veil:rgba(6,6,10,.92);
    --paper-ground:#f4eee3;
    --paper-text:#1d1a16;
    --paper-muted:rgba(29,26,22,.60);
    --paper-seal:#b03a22;
    --paper-hair:rgba(29,26,22,.16);
    --paper-veil:rgba(244,238,227,.94);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    color:var(--ink-text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body[data-mode="paper"]{
    --ink-ground:var(--paper-ground);
    --ink-text:var(--paper-text);
    --ink-muted:var(--paper-muted);
    --ink-seal:var(--paper-seal);
    --hairline:var(--paper-hair);
    --veil:var(--paper-veil);
  }

  #stage{
    position:relative;
    width:min(1150px,96vw);
    aspect-ratio:3/2;
    margin:0;
    overflow:hidden;
    background:var(--ink-ground);
    border-radius:10px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 50px -30px rgba(0,0,0,.85);
    transition:background-color .6s ease,color .6s ease;
    cursor:crosshair;
    isolation:isolate;
  }
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}

  .grain{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.55'/></svg>");
  }
  body[data-mode="paper"] .grain{opacity:.26;mix-blend-mode:multiply}

  #stage::after{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      radial-gradient(134% 102% at 50% 38%,rgba(0,0,0,0) 40%,rgba(0,0,0,.50) 100%),
      linear-gradient(180deg,rgba(0,0,0,.26) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 74%,rgba(0,0,0,.30) 100%);
    mix-blend-mode:multiply;
  }
  body[data-mode="paper"] #stage::after{
    background:
      radial-gradient(134% 102% at 50% 38%,rgba(255,255,255,0) 44%,rgba(92,74,48,.17) 100%),
      linear-gradient(180deg,rgba(92,74,48,.10) 0%,rgba(255,255,255,0) 16%,rgba(255,255,255,0) 80%,rgba(92,74,48,.11) 100%);
  }
  #stage::before{
    content:"";position:absolute;inset:10px;z-index:7;pointer-events:none;
    border:1px solid var(--hairline);border-radius:4px;
  }

  /* legibility veils — generous, so type survives a busy sheet */
  .veil{
    position:absolute;z-index:4;pointer-events:none;
    left:-10%;bottom:-16%;width:74%;height:78%;
    background:radial-gradient(ellipse 58% 52% at 24% 86%,var(--veil) 0%,rgba(0,0,0,0) 76%);
  }
  .veil.top{
    left:-10%;top:-14%;width:62%;height:40%;
    background:radial-gradient(ellipse 54% 54% at 10% 18%,var(--veil) 0%,rgba(0,0,0,0) 78%);
  }

  .layer{position:absolute;z-index:6;pointer-events:none}
  .layer.txt{text-shadow:0 1px 18px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.6)}
  body[data-mode="paper"] .layer.txt{text-shadow:0 1px 14px rgba(255,255,255,.98),0 0 30px rgba(255,255,255,.85)}

  .mark{top:26px;left:28px;display:flex;align-items:center;gap:11px;max-width:62%}
  .mark .mono{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .seal{
    flex:0 0 auto;width:28px;height:28px;border-radius:3px;background:var(--ink-seal);
    position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 12px rgba(210,69,47,.35);
    animation:pulse 7.5s ease-in-out infinite;
  }
  .seal i{position:absolute;display:block}
  .seal i:first-child{left:7px;top:6px;width:14px;height:14px;border:1.4px solid rgba(255,255,255,.9);border-radius:50%}
  .seal i:last-child{left:6px;top:13px;width:16px;height:1.4px;background:rgba(255,255,255,.9);transform:rotate(-41deg)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 0 0 rgba(210,69,47,0)}
    50%{box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 20px 2px rgba(210,69,47,.45)}
  }

  .title{left:28px;bottom:26px;max-width:min(44%,320px)}
  .title h1{
    margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-style:italic;
    font-size:clamp(26px,4.4vw,44px);line-height:1.03;letter-spacing:-.015em;color:var(--ink-text);
  }
  .title p{margin:11px 0 0;font-size:11.5px;line-height:1.62;color:var(--ink-muted);max-width:29ch}
  .hint{
    right:28px;bottom:28px;max-width:min(34%,240px);text-align:right;
    font-size:11px;letter-spacing:.04em;color:var(--ink-muted);transition:opacity .9s ease;
  }
  .hint.gone{opacity:0}
  .hint b{font-weight:600;color:var(--ink-text);opacity:.78}
  .hint .bar{display:inline-block;width:22px;height:1px;background:var(--ink-muted);vertical-align:middle;margin:0 8px}

  @media (max-width:560px){
    .title{max-width:72%}
    .hint{display:none}
    .mark{top:20px;left:20px}
    .title{left:20px;bottom:20px}
  }
</style>
</head>
<body data-mode="night">
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="grain"></div>
    <div class="veil"></div>
    <div class="veil top"></div>

    <div class="layer mark">
      <div class="seal" aria-hidden="true"><i></i><i></i></div>
      <div class="mono">Étude générative · nº 1</div>
    </div>

    <div class="layer title txt">
      <h1>Marée<br>d'encre</h1>
      <p>Le pigment suit un courant qui respire. Approche le pointeur&nbsp;: le tourbillon obéit à la main. Clique&nbsp;: la goutte tombe.</p>
    </div>

    <div class="layer hint txt" id="hint"><b>bouge</b><span class="bar"></span><b>clique</b></div>
  </div>

<script>
(() => {
  'use strict';
  const errors=[];
  window.addEventListener('error',e=>errors.push(String(e.message)));
  window.__errors=errors;

  const stage=document.getElementById('stage');
  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d',{alpha:false});
  const hintEl=document.getElementById('hint');
  const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= mode ================= */
  function parseColor(v){
    if(!v)return null; v=v.trim();
    let m=v.match(/rgba?\(([^)]+)\)/);
    if(m){const p=m[1].split(/[,\s\/]+/).filter(Boolean).map(parseFloat);return[p[0]||0,p[1]||0,p[2]||0];}
    m=v.match(/^#([0-9a-f]{6})$/i);
    if(m){const n=parseInt(m[1],16);return[(n>>16)&255,(n>>8)&255,n&255];}
    m=v.match(/^#([0-9a-f]{3})$/i);
    if(m){const n=parseInt(m[1],16);return[((n>>8)&15)*17,((n>>4)&15)*17,(n&15)*17];}
    return null;
  }
  const lum=c=>(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
  function detectMode(){
    const q=new URLSearchParams(location.search).get('mode');
    if(q==='night'||q==='paper')return q;
    const cs=getComputedStyle(document.documentElement);
    const card=parseColor(cs.getPropertyValue('--card'))||parseColor(cs.getPropertyValue('--background'));
    if(card)return lum(card)>0.55?'paper':'night';
    const fg=parseColor(cs.getPropertyValue('--foreground'));
    if(fg)return lum(fg)<0.5?'night':'paper';
    if(window.matchMedia('(prefers-color-scheme: light)').matches)return 'paper';
    return 'night';
  }
  let MODE=detectMode();
  document.body.dataset.mode=MODE;
  const NIGHT=MODE==='night';

  /* ================= pigments ================= */
  // paper palette deliberately avoids green: red+green reads as muddy olive
  const PALETTE={
    night:[[255,84,48],[255,192,72],[42,224,190],[126,104,255]],
    paper:[[178,52,30],[150,104,34],[52,58,120],[26,24,26]]
  };
  const pal=PALETTE[MODE];
  const NG=16;
  const COLS=[];
  for(let i=0;i<NG;i++){
    const u=(i/(NG-1))*(pal.length-1);
    const i0=Math.floor(u), i1=Math.min(pal.length-1,i0+1);
    const f=u-i0;
    // sharp-ish transition between pigments, soft edge only near the boundary
    const s=f<0.34?0:(f>0.66?1:(f-0.34)/0.32);
    const e=s*s*(3-2*s);
    const a=pal[i0], b=pal[i1];
    COLS.push([a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e, a[2]+(b[2]-a[2])*e]);
  }
  const rgb=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  /* ================= noise ================= */
  function hash2(x,y){
    let h=x*374761393+y*668265263;
    h=(h^(h>>13))*1274126177;
    return ((h^(h>>16))>>>0)/4294967295;
  }
  const smooth=t=>t*t*(3-2*t);
  function vnoise(x,y){
    const xi=Math.floor(x), yi=Math.floor(y);
    const xf=x-xi, yf=y-yi;
    const u=smooth(xf), v=smooth(yf);
    const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
    return (a+(b-a)*u)+((c-a)+(d-c)*u-(b-a)*u)*v;
  }
  let t=0;
  function psi(x,y){
    let s=0, amp=1, fx=0.0030, fy=0.0030, norm=0;
    for(let o=0;o<4;o++){
      s+=amp*vnoise(x*fx+t*0.018, y*fy);
      norm+=amp; amp*=0.5; fx*=2.03; fy*=2.03;
    }
    return s/norm;
  }
  // The raw band field never spans the full palette, so normalise it against
  // its own measured extent across the sheet — otherwise only 2 of 4 pigments
  // ever appear.
  let bandLo=0, bandHi=1;
  function measureBands(){
    let lo=Infinity, hi=-Infinity;
    for(let gx=0;gx<48;gx++){
      for(let gy=0;gy<32;gy++){
        const x=(gx+0.5)/48*S.W, y=(gy+0.5)/32*S.H;
        const v=vnoise(x*0.0034+91.3, y*0.0034-47.7)*0.55
              + vnoise(x*0.0071-13.1, y*0.0071+77.9)*0.30
              + vnoise(x*0.0135+5.7, y*0.0135-29.3)*0.15;
        if(v<lo)lo=v; if(v>hi)hi=v;
      }
    }
    if(hi-lo<0.02){ lo=0; hi=1; }
    bandLo=lo; bandHi=hi;
  }
  function pigmentAt(x,y){
    let v=vnoise(x*0.0034+91.3, y*0.0034-47.7)*0.55
         + vnoise(x*0.0071-13.1, y*0.0071+77.9)*0.30
         + vnoise(x*0.0135+5.7, y*0.0135-29.3)*0.15;
    v=Math.min(1,Math.max(0,(v-bandLo)/(bandHi-bandLo)));
    // gentle S-curve: pushes the extremes apart without hard banding edges
    v=v*v*(3-2*v)*0.78+v*0.22;
    return v*pal.length;
  }
  const EPS=2.2;
  const _v=[0,0];
  function curl(x,y,out){
    const dpx=(psi(x+EPS,y)-psi(x-EPS,y))/(2*EPS);
    const dpy=(psi(x,y+EPS)-psi(x,y-EPS))/(2*EPS);
    const m=Math.hypot(dpy,-dpx)||1;
    out[0]=dpy/m; out[1]=-dpx/m;
    return out;
  }

  /* ================= state ================= */
  const S={
    W:0,H:0,P:[],waves:[],breath:1,frames:0,target:0,
    pointer:{x:-999,y:-999,active:false,str:0},interacted:false
  };

  function resize(){
    const r=stage.getBoundingClientRect();
    S.W=Math.max(320,Math.round(r.width));
    S.H=Math.max(240,Math.round(r.height));
    const dpr=Math.min(1.75,window.devicePixelRatio||1);
    cv.width=Math.round(S.W*dpr); cv.height=Math.round(S.H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=NIGHT?'#07070c':'#f4eee3';
    ctx.fillRect(0,0,S.W,S.H);
    measureBands();
    S.target=Math.min(2400,Math.max(800,Math.floor(S.W*S.H/480)));
    // paper needs fewer deposits: overlapping multiply strokes muddy the sheet
    if(!NIGHT) S.target=Math.round(S.target*0.62);
    S.P=[];
    for(let i=0;i<S.target;i++) S.P.push(newParticle());
  }

  const rnd=(a,b)=>a+Math.random()*(b-a);
  function newParticle(){
    const x=Math.random()*S.W, y=Math.random()*S.H;
    return {
      x,y,px:x,py:y,
      fc:pigmentAt(x,y), g:0,
      spd:rnd(.55,1.55),
      w:NIGHT?rnd(.5,1.8):rnd(.45,1.6),
      a:NIGHT?rnd(.30,.72):rnd(.06,.22)
    };
  }
  function seedParticle(f){
    f.x=Math.random()*S.W; f.y=Math.random()*S.H;
    f.px=f.x; f.py=f.y;
    f.fc=pigmentAt(f.x,f.y);
    f.spd=rnd(.55,1.55);
    f.w=NIGHT?rnd(.5,1.8):rnd(.45,1.6);
    f.a=NIGHT?rnd(.30,.72):rnd(.06,.22);
  }

  /* ================= simulation ================= */
  function step(){
    t+=1/60;
    const breath=0.5+0.5*Math.sin(t*0.34-1.1);
    S.breath=breath;

    if(S.frames%820===300){
      S.waves.push({x:rnd(.18,.82)*S.W,y:rnd(.18,.82)*S.H,r:6,life:1,strength:1.2});
    }
    const p=S.pointer;
    p.str*=0.955;
    if(p.active)p.str=Math.min(1,p.str+0.22);

    for(let i=S.waves.length-1;i>=0;i--){
      const w=S.waves[i]; w.r+=3.6; w.life-=0.010;
      if(w.life<=0)S.waves.splice(i,1);
    }

    const speed=2.15*(0.55+0.6*breath);
    const drift=0.5+0.5*Math.sin(t*0.12);
    const P=S.P;
    for(let i=0;i<P.length;i++){
      const f=P[i];
      f.px=f.x; f.py=f.y;

      curl(f.x,f.y,_v);
      let mx=_v[0]*speed*f.spd+drift*0.30;
      let my=_v[1]*speed*f.spd+Math.cos(t*0.11)*0.24;

      if(p.str>0.02){
        const dx=f.x-p.x, dy=f.y-p.y, dd=Math.hypot(dx,dy), R=200;
        if(dd<R&&dd>0.001){
          const k=(1-dd/R)*p.str;
          mx+=(-dy/dd)*k*3.6; my+=(dx/dd)*k*3.6;
          mx-=(dx/dd)*k*0.55; my-=(dy/dd)*k*0.55;
        }
      }
      for(const w of S.waves){
        const dx=f.x-w.x, dy=f.y-w.y, dd=Math.hypot(dx,dy), band=w.r-38;
        if(Math.abs(dd-band)<38&&dd>0.001&&w.life>0){
          const k=(1-Math.abs(dd-band)/38)*w.strength*w.life;
          mx+=(dx/dd)*k*2.4; my+=(dy/dd)*k*2.4;
        }
      }

      f.x+=mx; f.y+=my;

      const target=pigmentAt(f.x,f.y);
      f.fc+=(target-f.fc)*0.03;
      f.g=Math.min(NG-1,Math.max(0,(f.fc/(pal.length-1)*(NG-1))|0));

      if(f.x<-60||f.x>S.W+60||f.y<-60||f.y>S.H+60) seedParticle(f);
    }
    S.frames++;
  }

  /* ================= painting ================= */
  const WB=4, AL=3;
  function paint(){
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=NIGHT?'rgba(7,7,12,.055)':'rgba(244,238,227,.075)';
    ctx.fillRect(0,0,S.W,S.H);

    // source-over keeps pigment hues; multiply darkens them like real ink on paper
    ctx.globalCompositeOperation=NIGHT?'source-over':'multiply';
    ctx.lineCap='round'; ctx.lineJoin='round';

    const buckets=[];
    for(let i=0;i<NG*WB*AL;i++) buckets.push(new Path2D());

    const P=S.P;
    for(let i=0;i<P.length;i++){
      const f=P[i];
      const wb=Math.min(WB-1,(f.w/0.45)|0);
      const al=Math.min(AL-1,(f.a/(NIGHT?0.26:0.055))|0);
      const path=buckets[(f.g*WB+wb)*AL+al];
      path.moveTo(f.px,f.py);
      path.lineTo(f.x,f.y);
    }

    for(let g=0;g<NG;g++){
      for(let wb=0;wb<WB;wb++){
        for(let al=0;al<AL;al++){
          const path=buckets[(g*WB+wb)*AL+al];
          const base=NIGHT?[.30,.48,.72][al]:[.12,.22,.34][al];
          ctx.strokeStyle=rgb(COLS[g],base);
          ctx.lineWidth=0.5+wb*0.40;
          ctx.stroke(path);
          // paper only: a wider, fainter pass underneath reads as ink bleeding
          if(!NIGHT){
            ctx.strokeStyle=rgb(COLS[g],base*0.10);
            ctx.lineWidth=2.4+wb*0.7;
            ctx.stroke(path);
          }
        }
      }
    }

    if(S.waves.length){
      ctx.globalCompositeOperation=NIGHT?'source-over':'multiply';
      for(const w of S.waves){
        const g=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
        const a=Math.max(0,w.life)*0.10;
        g.addColorStop(0,rgb(COLS[6],a));
        g.addColorStop(1,rgb(COLS[6],0));
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
  }

  /* ================= input ================= */
  function toLocal(e){
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  stage.addEventListener('pointermove',e=>{
    const q=toLocal(e);
    S.pointer.x=q.x; S.pointer.y=q.y; S.pointer.active=true;
    if(!S.interacted){S.interacted=true;hintEl.classList.add('gone');}
  },{passive:true});
  stage.addEventListener('pointerleave',()=>{S.pointer.active=false;});
  stage.addEventListener('pointerdown',e=>{
    const q=toLocal(e);
    S.pointer.x=q.x; S.pointer.y=q.y; S.pointer.str=1;
    const target=pigmentAt(q.x,q.y);
    for(let i=0;i<340;i++){
      const f=newParticle();
      const a=Math.random()*Math.PI*2, r=Math.pow(Math.random(),.55)*48;
      f.x=q.x+Math.cos(a)*r; f.y=q.y+Math.sin(a)*r;
      f.px=f.x; f.py=f.y;
      f.fc=target; f.g=Math.min(NG-1,Math.max(0,(target/(pal.length-1)*(NG-1))|0));
      f.a=NIGHT?rnd(.55,.95):rnd(.08,.16);
      f.spd=rnd(.4,1.2);
      S.P.push(f);
    }
    S.waves.push({x:q.x,y:q.y,r:6,life:1,strength:1.4});
    if(!S.interacted){S.interacted=true;hintEl.classList.add('gone');}
  });

  /* ================= loop ================= */
  let last=performance.now();
  function frame(now){
    const dt=Math.min(50,now-last); last=now;
    const sub=Math.max(1,Math.round(dt/16.667));
    for(let i=0;i<sub;i++) step();
    paint();
    while(S.P.length>S.target*1.3) S.P.pop();
    requestAnimationFrame(frame);
  }

  resize();
  const PRERUN=REDUCED?460:300;
  for(let i=0;i<PRERUN;i++){ step(); paint(); }
  if(!REDUCED) requestAnimationFrame(frame);

  let rTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(rTimer);
    rTimer=setTimeout(()=>{resize(); for(let i=0;i<140;i++){step();paint();}},160);
  });

  window.__stats=()=>({
    mode:MODE,particles:S.P.length,target:S.target,waves:S.waves.length,
    frames:S.frames,breath:Math.round(S.breath*100)/100,
    viewport:{w:S.W,h:S.H},reduced:REDUCED
  });

  // distribution of pigment bands across the sheet (verification hook)
  window.__bandHist=()=>{
    const h=new Array(NG).fill(0);
    for(let gx=0;gx<40;gx++){
      for(let gy=0;gy<26;gy++){
        const x=(gx+0.5)/40*S.W, y=(gy+0.5)/26*S.H;
        const b=pigmentAt(x,y);
        let g=Math.min(NG-1,Math.max(0,(b/(pal.length-1)*(NG-1))|0));
        h[g]++;
      }
    }
    // collapse into pigment-level counts
    const per=pal.map(()=>0);
    h.forEach((c,i)=>{
      const u=(i/(NG-1))*(pal.length-1);
      per[Math.min(pal.length-1,Math.round(u))]+=c;
    });
    return {groups:h,pigments:per};
  };
})();
</script>
